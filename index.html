<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .task-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .task-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 250px;
        }

        .task-input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .add-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            min-width: 200px;
        }

        .search-input:focus {
            outline: none;
            border-color: #4facfe;
        }

        .sort-select {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        .tasks-container {
            padding: 30px;
            min-height: 300px;
        }

        .task {
            display: flex;
            align-items: center;
            padding: 20px;
            background: white;
            border: 2px solid #f1f3f4;
            border-radius: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        .task:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .task.completed {
            background: #f8f9fa;
            border-color: #28a745;
        }

        .task.completed .task-text {
            text-decoration: line-through;
            color: #6c757d;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            transform: scale(1.2);
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            line-height: 1.5;
            word-break: break-word;
        }

        .task-date {
            font-size: 12px;
            color: #6c757d;
            margin-right: 15px;
            white-space: nowrap;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            color: #6c757d;
            font-size: 18px;
            padding: 60px 20px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 20px;
            border-top: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #4facfe;
        }

        .stat-label {
            font-size: 14px;
            color: #6c757d;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                padding: 20px;
            }

            .task-form {
                flex-direction: column;
            }

            .task-input {
                min-width: auto;
            }

            .filters {
                flex-direction: column;
            }

            .search-input {
                min-width: auto;
            }

            .tasks-container {
                padding: 20px;
            }

            .task {
                padding: 15px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .task-date {
                order: 3;
                width: 100%;
                margin-right: 0;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Menedżer Zadań</h1>
            <p>Organizuj swoje zadania efektywnie</p>
        </div>

        <div class="controls">
            <div class="task-form">
                <input type="text" class="task-input" placeholder="Wprowadź nowe zadanie..." maxlength="500">
                <button class="add-btn">Dodaj zadanie</button>
            </div>
            
            <div class="filters">
                <input type="text" class="search-input" placeholder="Wyszukaj zadania...">
                <select class="sort-select">
                    <option value="newest">Najnowsze</option>
                    <option value="oldest">Najstarsze</option>
                    <option value="alphabetical">Alfabetycznie</option>
                    <option value="completed">Wykonane</option>
                    <option value="pending">Oczekujące</option>
                </select>
            </div>
        </div>

        <div class="tasks-container">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <p>Brak zadań do wyświetlenia</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="total-tasks">0</div>
                <div class="stat-label">Wszystkich</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="completed-tasks">0</div>
                <div class="stat-label">Wykonanych</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="pending-tasks">0</div>
                <div class="stat-label">Oczekujących</div>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = '';
                this.currentSort = 'newest';
                this.initEventListeners();
                this.renderTasks();
                this.updateStats();
            }

            initEventListeners() {
                const taskInput = document.querySelector('.task-input');
                const addBtn = document.querySelector('.add-btn');
                const searchInput = document.querySelector('.search-input');
                const sortSelect = document.querySelector('.sort-select');
                const tasksContainer = document.querySelector('.tasks-container');

                addBtn.addEventListener('click', () => this.addTask());
                taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                searchInput.addEventListener('input', (e) => {
                    this.currentFilter = e.target.value.toLowerCase();
                    this.renderTasks();
                });

                sortSelect.addEventListener('change', (e) => {
                    this.currentSort = e.target.value;
                    this.renderTasks();
                });

                tasksContainer.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-btn')) {
                        const taskId = parseInt(e.target.dataset.taskId);
                        this.deleteTask(taskId);
                    }
                });

                tasksContainer.addEventListener('change', (e) => {
                    if (e.target.type === 'checkbox') {
                        const taskId = parseInt(e.target.dataset.taskId);
                        this.toggleTask(taskId);
                    }
                });
            }

            addTask() {
                const taskInput = document.querySelector('.task-input');
                const text = taskInput.value.trim();

                if (!text) {
                    taskInput.focus();
                    return;
                }

                const task = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.renderTasks();
                this.updateStats();
                
                taskInput.value = '';
                taskInput.focus();
            }

            deleteTask(taskId) {
                this.tasks = this.tasks.filter(task => task.id !== taskId);
                this.saveTasks();
                this.renderTasks();
                this.updateStats();
            }

            toggleTask(taskId) {
                const task = this.tasks.find(task => task.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.renderTasks();
                    this.updateStats();
                }
            }

            getFilteredAndSortedTasks() {
                let filteredTasks = this.tasks;

                if (this.currentFilter) {
                    filteredTasks = this.tasks.filter(task =>
                        task.text.toLowerCase().includes(this.currentFilter)
                    );
                }

                return this.sortTasks(filteredTasks);
            }

            sortTasks(tasks) {
                const sortedTasks = [...tasks];

                switch (this.currentSort) {
                    case 'oldest':
                        return sortedTasks.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                    case 'alphabetical':
                        return sortedTasks.sort((a, b) => a.text.localeCompare(b.text));
                    case 'completed':
                        return sortedTasks.sort((a, b) => b.completed - a.completed);
                    case 'pending':
                        return sortedTasks.sort((a, b) => a.completed - b.completed);
                    default: // newest
                        return sortedTasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                }
            }

            renderTasks() {
                const tasksContainer = document.querySelector('.tasks-container');
                const tasks = this.getFilteredAndSortedTasks();

                if (tasks.length === 0) {
                    tasksContainer.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                            </svg>
                            <p>${this.currentFilter ? 'Brak zadań pasujących do wyszukiwania' : 'Brak zadań do wyświetlenia'}</p>
                        </div>
                    `;
                    return;
                }

                tasksContainer.innerHTML = tasks.map(task => `
                    <div class="task ${task.completed ? 'completed' : ''}">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} data-task-id="${task.id}">
                        <div class="task-text">${this.escapeHtml(task.text)}</div>
                        <div class="task-date">${this.formatDate(task.createdAt)}</div>
                        <button class="delete-btn" data-task-id="${task.id}">Usuń</button>
                    </div>
                `).join('');
            }

            updateStats() {
                const totalTasks = this.tasks.length;
                const completedTasks = this.tasks.filter(task => task.completed).length;
                const pendingTasks = totalTasks - completedTasks;

                document.getElementById('total-tasks').textContent = totalTasks;
                document.getElementById('completed-tasks').textContent = completedTasks;
                document.getElementById('pending-tasks').textContent = pendingTasks;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diff = now - date;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));

                if (days === 0) {
                    return 'Dzisiaj';
                } else if (days === 1) {
                    return 'Wczoraj';
                } else if (days < 7) {
                    return `${days} dni temu`;
                } else {
                    return date.toLocaleDateString('pl-PL');
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(this.tasks));
            }

            loadTasks() {
                const tasks = localStorage.getItem('tasks');
                return tasks ? JSON.parse(tasks) : [];
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new TaskManager();
        });
    </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const nodes = Array.from(document.body.childNodes);

  for (const node of nodes) {
    if (
      node.nodeType === Node.TEXT_NODE &&
      node.textContent &&
      (
        node.textContent.trim().startsWith('```html') ||
        node.textContent.trim() === '```' ||
        node.textContent.trim() === 'html'
      )
    ) {
      node.remove();
    }
  }
});
</script>

</body>
</html>
