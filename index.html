<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
        }

        .task-form {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            margin: 0 2px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .sort-box {
            min-width: 150px;
        }

        .task-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .task-item.completed {
            background: #f8f9fa;
            border-color: #51cf66;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .task-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .task-date {
            font-size: 0.9rem;
            color: #888;
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .content {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
            }

            .search-box, .sort-box {
                min-width: auto;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .task-meta {
                flex-direction: column;
                align-items: flex-start;
            }

            .task-actions {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Menedżer Zadań</h1>
            <p>Organizuj swoje zadania efektywnie</p>
        </div>

        <div class="content">
            <div class="task-form">
                <h3 style="margin-bottom: 20px; color: #333;">Dodaj nowe zadanie</h3>
                <div class="form-group">
                    <label for="taskTitle">Tytuł zadania</label>
                    <input type="text" id="taskTitle" class="form-control" placeholder="Wprowadź tytuł zadania...">
                </div>
                <div class="form-group">
                    <label for="taskDescription">Opis zadania</label>
                    <textarea id="taskDescription" class="form-control" rows="3" placeholder="Wprowadź opis zadania..."></textarea>
                </div>
                <button onclick="addTask()" class="btn">Dodaj zadanie</button>
            </div>

            <div class="controls">
                <div class="search-box">
                    <input type="text" id="searchInput" class="form-control" placeholder="Wyszukaj zadania..." onkeyup="filterTasks()">
                </div>
                <div class="sort-box">
                    <select id="sortSelect" class="form-control" onchange="sortTasks()">
                        <option value="newest">Najnowsze</option>
                        <option value="oldest">Najstarsze</option>
                        <option value="title">Alfabetycznie</option>
                        <option value="completed">Ukończone</option>
                        <option value="pending">Oczekujące</option>
                    </select>
                </div>
            </div>

            <div id="taskList" class="task-list"></div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let taskIdCounter = parseInt(localStorage.getItem('taskIdCounter')) || 1;

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('taskIdCounter', taskIdCounter.toString());
        }

        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();

            if (!title) {
                alert('Proszę wprowadzić tytuł zadania');
                return;
            }

            const task = {
                id: taskIdCounter++,
                title: title,
                description: description,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(task);
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            if (confirm('Czy na pewno chcesz usunąć to zadanie?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
            }
        }

        function toggleTask(id) {
            const task = tasks.find(task => task.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('pl-PL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderTasks(tasksToRender = tasks) {
            const taskList = document.getElementById('taskList');
            
            if (tasksToRender.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <h3>Brak zadań</h3>
                        <p>Dodaj swoje pierwsze zadanie powyżej</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = tasksToRender.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-header">
                        <div class="task-title">${task.title}</div>
                    </div>
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                    <div class="task-meta">
                        <div class="task-date">Utworzono: ${formatDate(task.createdAt)}</div>
                        <div class="task-actions">
                            <button onclick="toggleTask(${task.id})" class="btn btn-small ${task.completed ? 'btn-success' : ''}">
                                ${task.completed ? 'Cofnij' : 'Ukończ'}
                            </button>
                            <button onclick="deleteTask(${task.id})" class="btn btn-small btn-danger">
                                Usuń
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterTasks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredTasks = tasks.filter(task => 
                task.title.toLowerCase().includes(searchTerm) ||
                task.description.toLowerCase().includes(searchTerm)
            );
            renderTasks(filteredTasks);
        }

        function sortTasks() {
            const sortBy = document.getElementById('sortSelect').value;
            let sortedTasks = [...tasks];

            switch (sortBy) {
                case 'newest':
                    sortedTasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    break;
                case 'oldest':
                    sortedTasks.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                    break;
                case 'title':
                    sortedTasks.sort((a, b) => a.title.localeCompare(b.title, 'pl'));
                    break;
                case 'completed':
                    sortedTasks = sortedTasks.filter(task => task.completed);
                    break;
                case 'pending':
                    sortedTasks = sortedTasks.filter(task => !task.completed);
                    break;
            }

            renderTasks(sortedTasks);
        }

        document.getElementById('taskTitle').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        document.getElementById('taskDescription').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                addTask();
            }
        });

        renderTasks();
    </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const nodes = Array.from(document.body.childNodes);

  for (const node of nodes) {
    if (
      node.nodeType === Node.TEXT_NODE &&
      node.textContent &&
      (
        node.textContent.trim().startsWith('```html') ||
        node.textContent.trim() === '```' ||
        node.textContent.trim() === 'html'
      )
    ) {
      node.remove();
    }
  }
});
</script>

</body>
</html>
