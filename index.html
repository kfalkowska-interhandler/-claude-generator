<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .task-form {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: #4facfe;
        }

        .priority-select {
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            min-width: 120px;
        }

        .add-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
        }

        .controls {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 0.95rem;
            min-width: 200px;
        }

        .sort-select {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .task-list {
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
        }

        .task-item {
            padding: 20px 30px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background-color 0.2s ease;
        }

        .task-item:hover {
            background-color: #f8f9fa;
        }

        .task-item.completed {
            background-color: #f0f9ff;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: #4facfe;
            cursor: pointer;
        }

        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .task-text {
            font-size: 1.1rem;
            color: #333;
            transition: all 0.3s ease;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .task-meta {
            font-size: 0.85rem;
            color: #666;
            display: flex;
            gap: 15px;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .priority-low {
            background: #dcfce7;
            color: #16a34a;
        }

        .delete-btn {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #999;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }

            .header h1 {
                font-size: 2rem;
            }

            .form-group {
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input {
                min-width: auto;
            }

            .stats {
                justify-content: center;
            }

            .task-item {
                padding: 15px 20px;
            }

            .task-meta {
                flex-direction: column;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .header {
                padding: 20px;
            }

            .task-form {
                padding: 20px;
            }

            .controls {
                padding: 15px 20px;
            }

            .task-item {
                padding: 12px 15px;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .task-content {
                width: 100%;
            }

            .task-actions {
                display: flex;
                width: 100%;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Menedżer Zadań</h1>
            <p>Organizuj swoją pracę efektywnie</p>
        </header>

        <div class="task-form">
            <div class="form-group">
                <input type="text" class="task-input" id="taskInput" placeholder="Wpisz nowe zadanie...">
                <select class="priority-select" id="prioritySelect">
                    <option value="low">Niski priorytet</option>
                    <option value="medium" selected>Średni priorytet</option>
                    <option value="high">Wysoki priorytet</option>
                </select>
                <button class="add-btn" id="addBtn">Dodaj zadanie</button>
            </div>
        </div>

        <div class="controls">
            <input type="text" class="search-input" id="searchInput" placeholder="Szukaj zadań...">
            <select class="sort-select" id="sortSelect">
                <option value="newest">Najnowsze</option>
                <option value="oldest">Najstarsze</option>
                <option value="priority">Priorytet</option>
                <option value="alphabetical">Alfabetycznie</option>
            </select>
            <div class="stats">
                <span id="totalTasks">Wszystkie: 0</span>
                <span id="completedTasks">Wykonane: 0</span>
                <span id="pendingTasks">Oczekujące: 0</span>
            </div>
        </div>

        <div class="task-list" id="taskList">
            <div class="empty-state" id="emptyState">
                <h3>Brak zadań</h3>
                <p>Dodaj swoje pierwsze zadanie, aby rozpocząć organizację pracy</p>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = '';
                this.currentSort = 'newest';
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.getElementById('taskInput');
                this.prioritySelect = document.getElementById('prioritySelect');
                this.addBtn = document.getElementById('addBtn');
                this.searchInput = document.getElementById('searchInput');
                this.sortSelect = document.getElementById('sortSelect');
                this.taskList = document.getElementById('taskList');
                this.emptyState = document.getElementById('emptyState');
                this.totalTasks = document.getElementById('totalTasks');
                this.completedTasks = document.getElementById('completedTasks');
                this.pendingTasks = document.getElementById('pendingTasks');
            }

            bindEvents() {
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });
                this.searchInput.addEventListener('input', (e) => this.handleSearch(e.target.value));
                this.sortSelect.addEventListener('change', (e) => this.handleSort(e.target.value));
            }

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.generateId(),
                    text: text,
                    completed: false,
                    priority: this.prioritySelect.value,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.render();
                this.taskInput.value = '';
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(task => task.id !== id);
                this.saveTasks();
                this.render();
            }

            toggleTask(id) {
                const task = this.tasks.find(task => task.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            handleSearch(query) {
                this.currentFilter = query.toLowerCase();
                this.render();
            }

            handleSort(sortType) {
                this.currentSort = sortType;
                this.render();
            }

            getFilteredTasks() {
                let filtered = this.tasks.filter(task => 
                    task.text.toLowerCase().includes(this.currentFilter)
                );

                switch (this.currentSort) {
                    case 'oldest':
                        return filtered.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                    case 'priority':
                        const priorityOrder = { high: 3, medium: 2, low: 1 };
                        return filtered.sort((a, b) => priorityOrder[b.priority] - priorityOrder[a.priority]);
                    case 'alphabetical':
                        return filtered.sort((a, b) => a.text.localeCompare(b.text, 'pl'));
                    case 'newest':
                    default:
                        return filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                }
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);

                if (diffMins < 1) return 'Przed chwilą';
                if (diffMins < 60) return `${diffMins} min temu`;
                if (diffHours < 24) return `${diffHours} godz. temu`;
                if (diffDays < 7) return `${diffDays} dni temu`;
                
                return date.toLocaleDateString('pl-PL');
            }

            getPriorityLabel(priority) {
                const labels = {
                    high: 'Wysoki',
                    medium: 'Średni',
                    low: 'Niski'
                };
                return labels[priority] || 'Średni';
            }

            updateStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(task => task.completed).length;
                const pending = total - completed;

                this.totalTasks.textContent = `Wszystkie: ${total}`;
                this.completedTasks.textContent = `Wykonane: ${completed}`;
                this.pendingTasks.textContent = `Oczekujące: ${pending}`;
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                this.updateStats();

                if (filteredTasks.length === 0) {
                    this.taskList.innerHTML = `
                        <div class="empty-state">
                            <h3>${this.currentFilter ? 'Nie znaleziono zadań' : 'Brak zadań'}</h3>
                            <p>${this.currentFilter ? 'Spróbuj zmienić kryteria wyszukiwania' : 'Dodaj swoje pierwsze zadanie, aby rozpocząć organizację pracy'}</p>
                        </div>
                    `;
                    return;
                }

                this.taskList.innerHTML = filteredTasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} 
                               onchange="taskManager.toggleTask('${task.id}')">
                        <div class="task-content">
                            <div class="task-text">${this.escapeHtml(task.text)}</div>
                            <div class="task-meta">
                                <span class="priority priority-${task.priority}">${this.getPriorityLabel(task.priority)}</span>
                                <span>${this.formatDate(task.createdAt)}</span>
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="delete-btn" onclick="taskManager.deleteTask('${task.id}')">Usuń</button>
                        </div>
                    </div>
                `).join('');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(this.tasks));
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('Błąd podczas wczytywania zadań:', error);
                    return [];
                }
            }
        }

        const taskManager = new TaskManager();
    </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const nodes = Array.from(document.body.childNodes);

  for (const node of nodes) {
    if (
      node.nodeType === Node.TEXT_NODE &&
      node.textContent &&
      (
        node.textContent.trim().startsWith('```html') ||
        node.textContent.trim() === '```' ||
        node.textContent.trim() === 'html'
      )
    ) {
      node.remove();
    }
  }
});
</script>

</body>
</html>
