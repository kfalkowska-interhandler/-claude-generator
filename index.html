<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .main-content {
            padding: 30px;
        }

        .add-task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .task-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            min-width: 250px;
        }

        .task-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            min-width: 200px;
        }

        .search-box:focus {
            border-color: #667eea;
        }

        .sort-select {
            padding: 12px 18px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            background: white;
        }

        .task-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            min-width: 120px;
        }

        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .tasks-container {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9ff;
            margin-bottom: 12px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease-out;
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .task-item.completed {
            opacity: 0.7;
            border-left-color: #43e97b;
            background: #f0fff4;
        }

        .task-checkbox {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #43e97b;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            line-height: 1.4;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #888;
        }

        .task-date {
            font-size: 12px;
            color: #888;
            margin-right: 15px;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .no-tasks {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .no-tasks-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-tasks-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .no-tasks-subtext {
            font-size: 1rem;
            opacity: 0.7;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }

            .header h1 {
                font-size: 2rem;
            }

            .main-content {
                padding: 20px;
            }

            .add-task-form {
                flex-direction: column;
            }

            .task-input {
                min-width: auto;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: auto;
                width: 100%;
            }

            .task-stats {
                flex-direction: column;
            }

            .stat-card {
                min-width: auto;
            }

            .task-item {
                flex-wrap: wrap;
                padding: 15px;
            }

            .task-date {
                order: 3;
                width: 100%;
                margin: 10px 0 0 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Menedżer Zadań</h1>
            <p>Organizuj swoje zadania efektywnie</p>
        </div>
        
        <div class="main-content">
            <form class="add-task-form" id="addTaskForm">
                <input 
                    type="text" 
                    class="task-input" 
                    id="taskInput" 
                    placeholder="Wpisz nowe zadanie..." 
                    required
                    maxlength="200"
                >
                <button type="submit" class="add-btn">➕ Dodaj zadanie</button>
            </form>

            <div class="controls">
                <input 
                    type="text" 
                    class="search-box" 
                    id="searchBox" 
                    placeholder="🔍 Wyszukaj zadania..."
                >
                <select class="sort-select" id="sortSelect">
                    <option value="newest">📅 Najnowsze</option>
                    <option value="oldest">📅 Najstarsze</option>
                    <option value="alphabetical">🔤 Alfabetycznie</option>
                    <option value="completed">✅ Wykonane</option>
                    <option value="pending">⏳ Oczekujące</option>
                </select>
            </div>

            <div class="task-stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Wszystkie</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">Oczekujące</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Wykonane</div>
                </div>
            </div>

            <div class="tasks-container" id="tasksContainer">
                <div class="no-tasks" id="noTasks">
                    <div class="no-tasks-icon">📋</div>
                    <div class="no-tasks-text">Brak zadań</div>
                    <div class="no-tasks-subtext">Dodaj pierwsze zadanie, aby zacząć</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.tasks = this.loadTasks();
                this.filteredTasks = [...this.tasks];
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskForm = document.getElementById('addTaskForm');
                this.taskInput = document.getElementById('taskInput');
                this.searchBox = document.getElementById('searchBox');
                this.sortSelect = document.getElementById('sortSelect');
                this.tasksContainer = document.getElementById('tasksContainer');
                this.noTasksElement = document.getElementById('noTasks');
                this.totalTasksElement = document.getElementById('totalTasks');
                this.pendingTasksElement = document.getElementById('pendingTasks');
                this.completedTasksElement = document.getElementById('completedTasks');
            }

            bindEvents() {
                this.taskForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addTask();
                });

                this.searchBox.addEventListener('input', () => {
                    this.filterTasks();
                });

                this.sortSelect.addEventListener('change', () => {
                    this.sortTasks();
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: Date.now() + Math.random(),
                    text: text,
                    completed: false,
                    createdAt: new Date()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.taskInput.value = '';
                this.filterTasks();
                this.updateStats();
            }

            deleteTask(taskId) {
                this.tasks = this.tasks.filter(task => task.id !== taskId);
                this.saveTasks();
                this.filterTasks();
                this.updateStats();
            }

            toggleTask(taskId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    task.completedAt = task.completed ? new Date() : null;
                    this.saveTasks();
                    this.filterTasks();
                    this.updateStats();
                }
            }

            filterTasks() {
                const searchTerm = this.searchBox.value.toLowerCase();
                this.filteredTasks = this.tasks.filter(task =>
                    task.text.toLowerCase().includes(searchTerm)
                );
                this.sortTasks();
            }

            sortTasks() {
                const sortBy = this.sortSelect.value;
                
                this.filteredTasks.sort((a, b) => {
                    switch (sortBy) {
                        case 'oldest':
                            return new Date(a.createdAt) - new Date(b.createdAt);
                        case 'alphabetical':
                            return a.text.toLowerCase().localeCompare(b.text.toLowerCase());
                        case 'completed':
                            return b.completed - a.completed;
                        case 'pending':
                            return a.completed - b.completed;
                        default: // newest
                            return new Date(b.createdAt) - new Date(a.createdAt);
                    }
                });
                
                this.render();
            }

            render() {
                if (this.filteredTasks.length === 0) {
                    this.noTasksElement.style.display = 'block';
                    this.tasksContainer.innerHTML = '';
                    this.tasksContainer.appendChild(this.noTasksElement);
                    return;
                }

                this.noTasksElement.style.display = 'none';
                this.tasksContainer.innerHTML = '';

                this.filteredTasks.forEach(task => {
                    const taskElement = this.createTaskElement(task);
                    this.tasksContainer.appendChild(taskElement);
                });

                this.updateStats();
            }

            createTaskElement(task) {
                const taskDiv = document.createElement('div');
                taskDiv.className = `task-item ${task.completed ? 'completed' : ''}`;
                taskDiv.innerHTML = `
                    <input 
                        type="checkbox" 
                        class="task-checkbox" 
                        ${task.completed ? 'checked' : ''}
                        onchange="taskManager.toggleTask(${task.id})"
                    >
                    <div class="task-text ${task.completed ? 'completed' : ''}">${this.escapeHtml(task.text)}</div>
                    <div class="task-date">${this.formatDate(task.createdAt)}</div>
                    <button 
                        class="delete-btn" 
                        onclick="taskManager.deleteTask(${task.id})"
                        title="Usuń zadanie"
                    >
                        🗑️
                    </button>
                `;
                return taskDiv;
            }

            updateStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(task => task.completed).length;
                const pending = total - completed;

                this.totalTasksElement.textContent = total;
                this.completedTasksElement.textContent = completed;
                this.pendingTasksElement.textContent = pending;
            }

            formatDate(date) {
                return new Date(date).toLocaleDateString('pl-PL', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            saveTasks() {
                localStorage.setItem('taskManagerTasks', JSON.stringify(this.tasks));
            }

            loadTasks() {
                try {
                    const saved = localStorage.getItem('taskManagerTasks');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            }
        }

        const taskManager = new TaskManager();
    </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const nodes = Array.from(document.body.childNodes);

  for (const node of nodes) {
    if (
      node.nodeType === Node.TEXT_NODE &&
      node.textContent &&
      (
        node.textContent.trim().startsWith('```html') ||
        node.textContent.trim() === '```' ||
        node.textContent.trim() === 'html'
      )
    ) {
      node.remove();
    }
  }
});
</script>

</body>
</html>
