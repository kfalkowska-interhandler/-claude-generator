<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .task-form {
            padding: 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
        }

        .sort-select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        .tasks-container {
            padding: 30px;
            min-height: 300px;
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tasks-count {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 500;
        }

        .task-item {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .task-item:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .task-item.completed {
            opacity: 0.7;
            background: #f1f5f9;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4f46e5;
        }

        .task-text {
            flex: 1;
            font-size: 1.1rem;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-priority {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .priority-low {
            background: #dcfce7;
            color: #16a34a;
        }

        .task-date {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-left: auto;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #64748b;
        }

        .priority-select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .header h1 {
                font-size: 2rem;
            }

            .form-group {
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input {
                min-width: auto;
            }

            .task-content {
                flex-wrap: wrap;
                gap: 10px;
            }

            .task-date {
                margin-left: 0;
                order: -1;
                width: 100%;
            }
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 15px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4f46e5;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Menedżer Zadań</h1>
            <p>Organizuj swoje zadania w prosty sposób</p>
        </div>

        <div class="task-form">
            <div class="form-group">
                <input type="text" id="taskInput" class="form-input" placeholder="Wpisz nowe zadanie..." maxlength="200">
                <select id="prioritySelect" class="priority-select">
                    <option value="low">Niski priorytet</option>
                    <option value="medium" selected>Średni priorytet</option>
                    <option value="high">Wysoki priorytet</option>
                </select>
                <button type="button" id="addTaskBtn" class="btn btn-primary">
                    ➕ Dodaj zadanie
                </button>
            </div>

            <div class="controls">
                <input type="text" id="searchInput" class="form-input search-input" placeholder="🔍 Wyszukaj zadania...">
                <select id="sortSelect" class="sort-select">
                    <option value="date-desc">Najnowsze</option>
                    <option value="date-asc">Najstarsze</option>
                    <option value="priority">Priorytet</option>
                    <option value="alphabetical">Alfabetycznie</option>
                    <option value="completed">Ukończone</option>
                </select>
            </div>
        </div>

        <div class="tasks-container">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Wszystkie</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Ukończone</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">Do zrobienia</div>
                </div>
            </div>

            <div class="tasks-header">
                <h2 class="tasks-count" id="tasksCount">Brak zadań</h2>
            </div>

            <div id="tasksList">
                <div class="empty-state">
                    <h3>Brak zadań</h3>
                    <p>Dodaj swoje pierwsze zadanie, aby rozpocząć organizowanie swojego czasu</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = '';
                this.currentSort = 'date-desc';
                this.initializeElements();
                this.bindEvents();
                this.renderTasks();
                this.updateStats();
            }

            initializeElements() {
                this.taskInput = document.getElementById('taskInput');
                this.prioritySelect = document.getElementById('prioritySelect');
                this.addTaskBtn = document.getElementById('addTaskBtn');
                this.searchInput = document.getElementById('searchInput');
                this.sortSelect = document.getElementById('sortSelect');
                this.tasksList = document.getElementById('tasksList');
                this.tasksCount = document.getElementById('tasksCount');
                this.totalTasks = document.getElementById('totalTasks');
                this.completedTasks = document.getElementById('completedTasks');
                this.pendingTasks = document.getElementById('pendingTasks');
            }

            bindEvents() {
                this.addTaskBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });
                this.searchInput.addEventListener('input', (e) => {
                    this.currentFilter = e.target.value.toLowerCase();
                    this.renderTasks();
                });
                this.sortSelect.addEventListener('change', (e) => {
                    this.currentSort = e.target.value;
                    this.renderTasks();
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                const priority = this.prioritySelect.value;

                if (!text) {
                    this.taskInput.focus();
                    return;
                }

                const task = {
                    id: Date.now().toString(),
                    text: text,
                    priority: priority,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.taskInput.value = '';
                this.renderTasks();
                this.updateStats();
                
                this.taskInput.focus();
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(task => task.id !== id);
                this.saveTasks();
                this.renderTasks();
                this.updateStats();
            }

            toggleTask(id) {
                const task = this.tasks.find(task => task.id === id);
                if (task) {
                    task.completed = !task.completed;
                    task.completedAt = task.completed ? new Date().toISOString() : null;
                    this.saveTasks();
                    this.renderTasks();
                    this.updateStats();
                }
            }

            getFilteredTasks() {
                let filtered = this.tasks;

                if (this.currentFilter) {
                    filtered = filtered.filter(task =>
                        task.text.toLowerCase().includes(this.currentFilter)
                    );
                }

                return this.sortTasks(filtered);
            }

            sortTasks(tasks) {
                const sorted = [...tasks];

                switch (this.currentSort) {
                    case 'date-asc':
                        return sorted.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                    case 'date-desc':
                        return sorted.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    case 'priority':
                        const priorityOrder = { high: 3, medium: 2, low: 1 };
                        return sorted.sort((a, b) => priorityOrder[b.priority] - priorityOrder[a.priority]);
                    case 'alphabetical':
                        return sorted.sort((a, b) => a.text.localeCompare(b.text, 'pl'));
                    case 'completed':
                        return sorted.sort((a, b) => a.completed - b.completed);
                    default:
                        return sorted;
                }
            }

            renderTasks() {
                const filteredTasks = this.getFilteredTasks();

                if (filteredTasks.length === 0) {
                    this.tasksList.innerHTML = `
                        <div class="empty-state">
                            <h3>${this.currentFilter ? 'Brak wyników' : 'Brak zadań'}</h3>
                            <p>${this.currentFilter ? 'Spróbuj zmienić kryteria wyszukiwania' : 'Dodaj swoje pierwsze zadanie, aby rozpocząć organizowanie swojego czasu'}</p>
                        </div>
                    `;
                    this.tasksCount.textContent = this.currentFilter ? 'Brak wyników wyszukiwania' : 'Brak zadań';
                    return;
                }

                const tasksHTML = filteredTasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <div class="task-content">
                            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} 
                                   onchange="taskManager.toggleTask('${task.id}')">
                            <span class="task-text ${task.completed ? 'completed' : ''}">${this.escapeHtml(task.text)}</span>
                            <span class="task-priority priority-${task.priority}">${this.getPriorityText(task.priority)}</span>
                            <span class="task-date">${this.formatDate(task.createdAt)}</span>
                            <button class="btn-delete" onclick="taskManager.deleteTask('${task.id}')" title="Usuń zadanie">
                                ❌
                            </button>
                        </div>
                    </div>
                `).join('');

                this.tasksList.innerHTML = tasksHTML;
                this.tasksCount.textContent = `${filteredTasks.length} ${this.getTasksLabel(filteredTasks.length)}`;
            }

            updateStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(task => task.completed).length;
                const pending = total - completed;

                this.totalTasks.textContent = total;
                this.completedTasks.textContent = completed;
                this.pendingTasks.textContent = pending;
            }

            getPriorityText(priority) {
                const priorities = {
                    low: 'Niski',
                    medium: 'Średni',
                    high: 'Wysoki'
                };
                return priorities[priority] || priority;
            }

            getTasksLabel(count) {
                if (count === 1) return 'zadanie';
                if (count >= 2 && count <= 4) return 'zadania';
                return 'zadań';
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffInHours = (now - date) / (1000 * 60 * 60);

                if (diffInHours < 1) {
                    const minutes = Math.floor((now - date) / (1000 * 60));
                    return minutes <= 1 ? 'przed chwilą' : `${minutes} min temu`;
                }

                if (diffInHours < 24) {
                    const hours = Math.floor(diffInHours);
