<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .task-form {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }

        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .task-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .task-input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .controls {
            padding: 0 30px 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            min-width: 200px;
        }

        .sort-select {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .tasks-container {
            padding: 0 30px 30px;
            min-height: 200px;
        }

        .task-item {
            background: #f8f9fa;
            border-left: 4px solid #4facfe;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-item.completed {
            border-left-color: #28a745;
            background: #e8f5e8;
        }

        .task-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            font-size: 16px;
            color: #333;
            transition: all 0.3s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #888;
            opacity: 0.7;
        }

        .task-date {
            font-size: 12px;
            color: #666;
            margin-left: 15px;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #4facfe;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 0 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .form-group {
                flex-direction: column;
            }

            .task-input {
                min-width: auto;
            }

            .controls {
                flex-direction: column;
            }

            .search-input {
                min-width: auto;
                width: 100%;
            }

            .task-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .task-content {
                width: 100%;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Menedżer Zadań</h1>
            <p>Organizuj swoje zadania w prosty sposób</p>
        </div>

        <div class="task-form">
            <div class="form-group">
                <input type="text" id="taskInput" class="task-input" placeholder="Wpisz nowe zadanie...">
                <button onclick="addTask()" class="btn btn-primary">Dodaj zadanie</button>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Szukaj zadań..." onkeyup="searchTasks()">
            <select id="sortSelect" class="sort-select" onchange="sortTasks()">
                <option value="date-desc">Najnowsze pierwsze</option>
                <option value="date-asc">Najstarsze pierwsze</option>
                <option value="alpha-asc">Alfabetycznie A-Z</option>
                <option value="alpha-desc">Alfabetycznie Z-A</option>
                <option value="completed">Ukończone pierwsze</option>
                <option value="pending">Oczekujące pierwsze</option>
            </select>
        </div>

        <div class="tasks-container" id="tasksContainer">
            <div class="empty-state">
                <h3>Brak zadań</h3>
                <p>Dodaj swoje pierwsze zadanie powyżej</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Wszystkie</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Ukończone</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="pendingTasks">0</div>
                <div class="stat-label">Oczekujące</div>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = '';
        let currentSort = 'date-desc';

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const taskText = taskInput.value.trim();

            if (taskText === '') {
                alert('Proszę wpisać zadanie');
                return;
            }

            const task = {
                id: Date.now(),
                text: taskText,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(task);
            taskInput.value = '';
            saveTasks();
            renderTasks();
            updateStats();
        }

        function deleteTask(id) {
            if (confirm('Czy na pewno chcesz usunąć to zadanie?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        function toggleTask(id) {
            const task = tasks.find(task => task.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('pl-PL') + ' ' + date.toLocaleTimeString('pl-PL', {hour: '2-digit', minute: '2-digit'});
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            let filteredTasks = tasks;

            if (currentFilter) {
                filteredTasks = tasks.filter(task => 
                    task.text.toLowerCase().includes(currentFilter.toLowerCase())
                );
            }

            filteredTasks = sortTasksArray(filteredTasks);

            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>${currentFilter ? 'Brak pasujących zadań' : 'Brak zadań'}</h3>
                        <p>${currentFilter ? 'Spróbuj zmienić wyszukiwanie' : 'Dodaj swoje pierwsze zadanie powyżej'}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredTasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-content">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                        <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                        <span class="task-date">${formatDate(task.createdAt)}</span>
                    </div>
                    <div class="task-actions">
                        <button class="btn-small btn-delete" onclick="deleteTask(${task.id})">Usuń</button>
                    </div>
                </div>
            `).join('');
        }

        function sortTasksArray(tasksArray) {
            const sortedTasks = [...tasksArray];
            
            switch (currentSort) {
                case 'date-asc':
                    return sortedTasks.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                case 'date-desc':
                    return sortedTasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                case 'alpha-asc':
                    return sortedTasks.sort((a, b) => a.text.localeCompare(b.text, 'pl'));
                case 'alpha-desc':
                    return sortedTasks.sort((a, b) => b.text.localeCompare(a.text, 'pl'));
                case 'completed':
                    return sortedTasks.sort((a, b) => b.completed - a.completed);
                case 'pending':
                    return sortedTasks.sort((a, b) => a.completed - b.completed);
                default:
                    return sortedTasks;
            }
        }

        function searchTasks() {
            const searchInput = document.getElementById('searchInput');
            currentFilter = searchInput.value;
            renderTasks();
        }

        function sortTasks() {
            const sortSelect = document.getElementById('sortSelect');
            currentSort = sortSelect.value;
            renderTasks();
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const pending = total - completed;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('pendingTasks').textContent = pending;
        }

        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        renderTasks();
        updateStats();
    </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const nodes = Array.from(document.body.childNodes);

  for (const node of nodes) {
    if (
      node.nodeType === Node.TEXT_NODE &&
      node.textContent &&
      (
        node.textContent.trim().startsWith('```html') ||
        node.textContent.trim() === '```' ||
        node.textContent.trim() === 'html'
      )
    ) {
      node.remove();
    }
  }
});
</script>

</body>
</html>
