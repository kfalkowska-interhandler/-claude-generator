<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            padding: 30px;
        }

        .task-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .btn-danger:hover {
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .sort-box {
            min-width: 150px;
        }

        .tasks-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            min-height: 200px;
        }

        .task-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            position: relative;
        }

        .task-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .task-item.completed {
            opacity: 0.7;
            background: #f1f3f4;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
        }

        .task-header {
            display: flex;
            justify-content: between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 15px;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .task-description {
            color: #6c757d;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 15px;
        }

        .task-priority {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .priority-wysoki {
            background: #ffebee;
            color: #c62828;
        }

        .priority-średni {
            background: #fff3e0;
            color: #ef6c00;
        }

        .priority-niski {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            display: block;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .task-form {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
            }

            .search-box,
            .sort-box {
                width: 100%;
            }

            .task-header {
                flex-direction: column;
                gap: 10px;
            }

            .task-actions {
                justify-content: center;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .task-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Menedżer Zadań</h1>
            <p>Organizuj swoje zadania efektywnie</p>
        </div>

        <div class="main-content">
            <div class="stats" id="statsContainer">
                <div class="stat-card">
                    <span class="stat-number" id="totalTasks">0</span>
                    <div class="stat-label">Wszystkich zadań</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="completedTasks">0</span>
                    <div class="stat-label">Ukończonych</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="pendingTasks">0</span>
                    <div class="stat-label">Oczekujących</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="completionRate">0%</span>
                    <div class="stat-label">Procent ukończenia</div>
                </div>
            </div>

            <div class="task-form">
                <h2 style="margin-bottom: 20px; color: #495057;">➕ Dodaj nowe zadanie</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Tytuł zadania</label>
                        <input type="text" id="taskTitle" required placeholder="Wpisz tytuł zadania...">
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Opis</label>
                        <textarea id="taskDescription" placeholder="Opcjonalny opis zadania..."></textarea>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label for="taskPriority">Priorytet</label>
                            <select id="taskPriority">
                                <option value="niski">Niski</option>
                                <option value="średni" selected>Średni</option>
                                <option value="wysoki">Wysoki</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskCategory">Kategoria</label>
                            <input type="text" id="taskCategory" placeholder="np. Praca, Dom...">
                        </div>
                        <div class="form-group">
                            <label for="taskDueDate">Termin</label>
                            <input type="date" id="taskDueDate">
                        </div>
                    </div>
                    <button type="submit" class="btn">
                        ➕ Dodaj zadanie
                    </button>
                </form>
            </div>

            <div class="controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Wyszukaj zadania...">
                </div>
                <div class="sort-box">
                    <select id="sortSelect">
                        <option value="newest">Najnowsze</option>
                        <option value="oldest">Najstarsze</option>
                        <option value="priority">Priorytet</option>
                        <option value="alphabetical">Alfabetycznie</option>
                        <option value="dueDate">Termin</option>
                    </select>
                </div>
                <button class="btn btn-small" id="filterAll">Wszystkie</button>
                <button class="btn btn-small" id="filterPending">Oczekujące</button>
                <button class="btn btn-small" id="filterCompleted">Ukończone</button>
            </div>

            <div class="tasks-container">
                <div id="tasksList"></div>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.currentSort = 'newest';
                this.searchQuery = '';
                
                this.initializeEventListeners();
                this.renderTasks();
                this.updateStats();
            }

            initializeEventListeners() {
                document.getElementById('taskForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addTask();
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchQuery = e.target.value.toLowerCase();
                    this.renderTasks();
                });

                document.getElementById('sortSelect').addEventListener('change', (e) => {
                    this.currentSort = e.target.value;
                    this.renderTasks();
                });

                document.getElementById('filterAll').addEventListener('click', () => {
                    this.currentFilter = 'all';
                    this.updateFilterButtons();
                    this.renderTasks();
                });

                document.getElementById('filterPending').addEventListener('click', () => {
                    this.currentFilter = 'pending';
                    this.updateFilterButtons();
                    this.renderTasks();
                });

                document.getElementById('filterCompleted').addEventListener('click', () => {
                    this.currentFilter = 'completed';
                    this.updateFilterButtons();
                    this.renderTasks();
                });
            }

            addTask() {
                const title = document.getElementById('taskTitle').value.trim();
                const description = document.getElementById('taskDescription').value.trim();
                const priority = document.getElementById('taskPriority').value;
                const category = document.getElementById('taskCategory').value.trim();
                const dueDate = document.getElementById('taskDueDate').value;

                if (!title) return;

                const task = {
                    id: Date.now().toString(),
                    title,
                    description,
                    priority,
                    category,
                    dueDate,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.renderTasks();
                this.updateStats();
                this.clearForm();
            }

            toggleTask(id) {
                const task = this.tasks.find(task => task.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.renderTasks();
                    this.updateStats();
                }
            }

            deleteTask(id) {
                if (confirm('Czy na pewno chcesz usunąć to zadanie?')) {
                    this.tasks = this.tasks.filter(task => task.id !== id);
                    this.saveTasks();
                    this.renderTasks();
                    this.updateStats();
                }
            }

            editTask(id) {
                const task = this.tasks.find(task => task.id === id);
                if (task) {
                    const newTitle = prompt('Edytuj tytuł zadania:', task.title);
                    if (newTitle !== null && newTitle.trim()) {
                        task.title = newTitle.trim();
                        const newDescription = prompt('Edytuj opis zadania:', task.description);
                        if (newDescription !== null) {
                            task.description = newDescription.trim();
                        }
                        this.saveTasks();
                        this.renderTasks();
                    }
                }
            }

            getFilteredAndSortedTasks() {
                let filteredTasks = this.tasks;

                // Filtrowanie
                if (this.currentFilter === 'pending') {
                    filteredTasks = filteredTasks.filter(task => !task.completed);
                } else if (this.currentFilter === 'completed') {
                    filteredTasks = filteredTasks.filter(task => task.completed);
                }

                // Wyszukiwanie
                if (this.searchQuery) {
                    filteredTasks = filteredTasks.filter(task => 
                        task.title.toLowerCase().includes(this.searchQuery) ||
                        task.description.toLowerCase().includes(this.searchQuery) ||
                        task.category.toLowerCase().includes(this.searchQuery)
                    );
                }

                // Sortowanie
                const priorityOrder = { 'wysoki': 3, 'średni': 2, 'niski': 1 };
                
                filteredTasks.sort((a, b) => {
                    switch (this.currentSort) {
                        case 'oldest':
                            return new Date(a.createdAt) - new Date(b.createdAt);
                        case 'priority':
                            return priorityOrder[b.priority] - priorityOrder[a.priority];
                        case 'alphabetical':
                            return a.title.localeCompare(b.title);
                        case 'dueDate':
                            if (!a.dueDate && !b.dueDate) return 0;
                            if (!a.dueDate) return 1;
                            if (!b.dueDate) return -1;
                            return new Date(a.dueDate) - new Date(b.dueDate);
                        default: // newest
                            return new Date(b.createdAt) - new Date(a.createdAt);
                    }
                });

                return filteredTasks;
            }

            renderTasks() {
                const tasksList = document.getElementById('tasksList');
                const tasks = this.getFilteredAndSortedTasks();

                if (tasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 3em; margin-bottom: 15px; opacity: 0.5;">📝</div>
                            <h3>Brak zadań do wyświetlenia</h3>
                            <p>Dodaj nowe zadanie lub zmień kryteria wyszukiwania</p>
                        </div>
                    `;
                    return;
                }

                tasksList.innerHTML = tasks.map(task => `
                    <div class="task-item ${task.
<script>
document.addEventListener('DOMContentLoaded', function () {
  const nodes = Array.from(document.body.childNodes);

  for (const node of nodes) {
    if (
      node.nodeType === Node.TEXT_NODE &&
      node.textContent &&
      (
        node.textContent.trim().startsWith('```html') ||
        node.textContent.trim() === '```' ||
        node.textContent.trim() === 'html'
      )
    ) {
      node.remove();
    }
  }
});
</script>
